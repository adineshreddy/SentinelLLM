global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: sentinel-gateway
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-key
    scrape_timeout: 3s
    static_configs:
      - targets: [gateway:8080]
